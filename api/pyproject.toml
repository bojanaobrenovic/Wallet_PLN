[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's Depends() in default arguments is the intended pattern, not a bug
extend-immutable-calls = ["fastapi.Depends"]

[tool.ruff.lint.per-file-ignores]
# Long Markdown descriptions for Swagger
"app/swagger_docs.py" = ["E501", "W291", "W293"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]